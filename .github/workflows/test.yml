name: Test Suite

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.14"
      - name: "Install test requirements"
        run: pip install -r tests/requirements_test.txt
      - name: "Resolve Home Assistant integration requirements"
        run: |
          python tests/gen_requirements.py --output requirements_ha.txt
          cat requirements_ha.txt
      - name: "Install Home Assistant integration requirements"
        run: pip install -r requirements_ha.txt
      - name: "Run pytest"
        env:
          PYTHONPATH: "tests"
        run: pytest tests

  test-latest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.14"
      - name: "Install test requirements (unpinned)"
        run: pip install pytest-homeassistant-custom-component
      - name: "Resolve Home Assistant integration requirements"
        run: |
          python tests/gen_requirements.py --output requirements_ha.txt
          cat requirements_ha.txt
      - name: "Install Home Assistant integration requirements"
        run: pip install -r requirements_ha.txt
      - name: "Run pytest"
        env:
          PYTHONPATH: "tests"
        run: pytest tests
