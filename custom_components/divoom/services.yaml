alarm:
  fields:
    device:
      required: true
      example: divoom_ditoo
      selector:
        text:
    number:
      example: 0
      selector:
        number:
          min: 0
          max: 255
          mode: box
    value:
      example: "07:30:00"
      selector:
        time:
    weekday:
      example: [mon, tue, wed, thu, fri]
      selector:
        select:
          multiple: true
          translation_key: weekday
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
    alarmmode:
      example: 0
      selector:
        number:
          min: 0
          max: 255
          mode: box
    triggermode:
      example: 0
      selector:
        number:
          min: 0
          max: 255
          mode: box
    frequency:
      example: 100.3
      selector:
        number:
          min: 64
          max: 108
          step: 0.1
          unit_of_measurement: MHz
          mode: box
    volume:
      example: 75
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
          mode: slider

